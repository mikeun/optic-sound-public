# EQ Control device
ctl.equal {
    type equal
    controls "/var/lib/alsa/equalizer.bin"
}

# 1. THE HARDWARE BASE
pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_key_add_uid false
    ipc_perm 0666
    slave {
        pcm "hw:0,1"
        rate 44100
        period_time 0
        period_size 1024
        buffer_size 8192
    }
}

# 2. THE GLOBAL EQUALIZER
pcm.plugequal {
    type equal
    slave.pcm "plug:dmixer"
    controls "/var/lib/alsa/equalizer.bin"
}

# 3. INDEPENDENT AIRPLAY VOLUME
pcm.airplay_softvol {
    type softvol
    slave {
        pcm "plug:plugequal"
    }
    control {
        name "AirPlay"
        card <CARD_ID>
    }
    hint {
        show on
        description "AirPlay with Volume & EQ"
    }
}

# 4. INDEPENDENT TURNTABLE VOLUME
pcm.turntable_softvol {
    type softvol
    slave {
        pcm "plug:plugequal"
    }
    control {
        name "Turntable"
        card <CARD_ID>
    }
    hint {
        show on
        description "Turntable with Volume & EQ"
    }
}

# 5. GENERAL OUTPUT
pcm.optic_plug {
    type plug
    slave.pcm "plugequal"
    hint {
        show on
        description "General Optical Output (EQ Only)"
    }
}

# 6. ENFORCE EQ AS DEFAULT
pcm.!default {
    type plug
    slave.pcm "plugequal"
}

ctl.!default {
    type equal
    controls "/var/lib/alsa/equalizer.bin"
}

# TODO: Replace <CARD_ID> with your actual ALSA card index (check 'aplay -l')
